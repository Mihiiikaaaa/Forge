project:
  name: "FORGE"
  seed: 42

development:
  model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

forget_percentages:
  - 1
  - 5
  - 10

baselines:
  - gradient_ascent
  - retain_aware
  - baseline_unlearning

proposed_method:
  name: "FORGE"

evaluation:
  metrics:
    - answer_likelihood
    - truth_ratio
    - forget_quality
    - rouge_l
    - model_utility
    - forgetting_score
    - relative_drop
    - retention
    - paraphrase_robustness
    - indirect_inference
    - relearning_resistance
    - blast_radius

robustness:
  paraphrases_per_target: 4

blast_radius:
  embedding_model: "all-MiniLM-L6-v2"
  candidates_per_target: 20

  categories:
    - related
    - moderately_related
    - unrelated
